version: 2

updates:
  # Every package bump is a supply-chain event worth a human look, so these open
  # PRs rather than automerging. Dependency count is a security property here.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Actions are SHA-pinned, which means they do not update themselves. Without
  # this, pinning quietly turns into rotting.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
